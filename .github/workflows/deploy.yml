name: Build and Deploy

# Builds the Astro site and deploys the generated `dist/` output to the Strato
# server over SFTP. Replaces the former Webflow scrape → commit → upload flow.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Avoid overlapping deploys stepping on each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Astro and upload to SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "./dist" ] || [ ! -f "./dist/index.html" ]; then
            echo "❌ Error: dist/ was not produced"
            exit 1
          fi
          echo "✅ dist/ built successfully"
          ls -la ./dist

      - name: Upload files to SFTP
        uses: Creepios/sftp-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localPath: "./dist/"
          remotePath: "./musikversicherung/"

      - name: Done
        run: echo "✅ Deployed dist/ to the server"
